name: PyZMQ Windows native acceptance
on:
  push:
    branches: [codex/pyzmq-native-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-arm64
            runner: windows-11-arm
            config: win_arm64_is_abi3truepython3.14.____cp314
            abi3: 'true'
          - platform: win-arm64
            runner: windows-11-arm
            config: win_arm64_is_abi3falsepython3.14.____cp314t
            abi3: 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYZMQ_PLATFORM: ${{ matrix.platform }}
      PYZMQ_ABI3: ${{ matrix.abi3 }}
    steps:
      - uses: actions/checkout@v4
      - name: Provision orchestration tools
        shell: pwsh
        run: |
          $env:CONDA_SUBDIR = 'win-64'
          Invoke-WebRequest https://github.com/mamba-org/micromamba-releases/releases/download/1.5.10-0/micromamba-win-64 -OutFile "$env:RUNNER_TEMP\micromamba.exe"
          & "$env:RUNNER_TEMP\micromamba.exe" create -y -p C:\pyzmq-tools -c conda-forge python=3.14 conda conda-index rattler-build pyyaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retrieve validated ARM64 prerequisites
        if: matrix.platform == 'win-arm64'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir C:\pyzmq-download
          mkdir C:\pyzmq-prerequisite\win-arm64
          gh api repos/ClayWarren/libsodium-feedstock/actions/artifacts/10078247267/zip > C:\pyzmq-download\libsodium.tar.zst
          if errorlevel 1 exit /b 1
          gh run download 34283305757 --repo ClayWarren/zeromq-feedstock --name zeromq-win-arm64-drafts-OFF --dir C:\pyzmq-prerequisite\win-arm64
          if errorlevel 1 exit /b 1
          C:\pyzmq-tools\python.exe validation\prerequisites.py
          if errorlevel 1 exit /b 1
          call C:\pyzmq-tools\Scripts\activate.bat
          call conda index C:\pyzmq-prerequisite
          if errorlevel 1 exit /b 1
      - name: Build and run unchanged recipe tests
        shell: cmd
        run: |
          call C:\pyzmq-tools\Scripts\activate.bat
          if errorlevel 1 exit /b 1
          set "CONDA_SUBDIR=%PYZMQ_PLATFORM%"
          python validation\select_variant.py .ci_support\${{ matrix.config }}.yaml
          if errorlevel 1 exit /b 1
          rattler-build build -r recipe -m validation\selected.yaml --build-platform %PYZMQ_PLATFORM% --target-platform %PYZMQ_PLATFORM% --output-dir C:\pyzmq-output --channel-priority strict
          if errorlevel 1 exit /b 1
      - name: Fresh install and runtime acceptance
        shell: cmd
        run: |
          call C:\pyzmq-tools\Scripts\activate.bat
          if errorlevel 1 exit /b 1
          set "CONDA_SUBDIR=%PYZMQ_PLATFORM%"
          call conda index C:\pyzmq-output
          if errorlevel 1 exit /b 1
          set "PREREQUISITE_CHANNEL="
          if "%PYZMQ_PLATFORM%"=="win-arm64" set "PREREQUISITE_CHANNEL=-c file:///C:/pyzmq-prerequisite"
          set "RUNTIME_PYTHON=python=3.14.*=*_cp314"
          if "%PYZMQ_ABI3%"=="false" set "RUNTIME_PYTHON=python=3.14.*=*_cp314t"
          call conda create -y -p C:\pyzmq-runtime --override-channels -c file:///C:/pyzmq-output %PREREQUISITE_CHANNEL% -c conda-forge --strict-channel-priority "%RUNTIME_PYTHON%" "pyzmq=27.2.0=*_1" abi3audit
          if errorlevel 1 exit /b 1
          call conda activate C:\pyzmq-runtime
          if errorlevel 1 exit /b 1
          python validation\runtime.py
          if errorlevel 1 exit /b 1
      - name: Forward compatibility on Python 3.15
        if: matrix.abi3 == 'true'
        shell: cmd
        run: |
          call C:\pyzmq-tools\Scripts\activate.bat
          if errorlevel 1 exit /b 1
          set "CONDA_SUBDIR=%PYZMQ_PLATFORM%"
          set "PREREQUISITE_CHANNEL="
          if "%PYZMQ_PLATFORM%"=="win-arm64" set "PREREQUISITE_CHANNEL=-c file:///C:/pyzmq-prerequisite"
          call conda create -y -p C:\pyzmq-runtime315 --override-channels -c file:///C:/pyzmq-output %PREREQUISITE_CHANNEL% -c conda-forge -c conda-forge/label/python_rc --strict-channel-priority "python=3.15.*=*_cp315" "pyzmq=27.2.0=*_1" abi3audit pytest
          if errorlevel 1 exit /b 1
          call conda activate C:\pyzmq-runtime315
          if errorlevel 1 exit /b 1
          python validation\runtime.py
          if errorlevel 1 exit /b 1
          python -m pytest -v recipe\tests
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: pyzmq-${{ matrix.platform }}-abi3-${{ matrix.abi3 }}
          path: C:/pyzmq-output/${{ matrix.platform }}/*.conda
          if-no-files-found: error
